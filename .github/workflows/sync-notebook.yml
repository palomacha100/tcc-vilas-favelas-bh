name: Sync Notebooks from S3

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Download all notebooks from S3
        run: |
          mkdir -p notebooks
          aws s3 cp s3://aws-glue-assets-710271939024-us-east-1/notebooks/ notebooks/ --recursive

      - name: Commit changes
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "glue-bot"
          git add notebooks/
          git commit -m "Update glue notebook" || echo "Nothing to commit"
          git push
